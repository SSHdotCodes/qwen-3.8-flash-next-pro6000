name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r bench/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: for script in serve/*.sh serve/patches/*.sh; do bash -n "$script"; done
      - run: python -m compileall -q bench serve
